[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-support-agent"
version = "1.0.0"
description = "Production-grade real-time AI voice customer-support agent (RAG + AWS Bedrock + Sarvam AI) for e-commerce and pharma."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.7",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "pymongo>=4.13",
    "aioboto3>=13.0",
    "httpx>=0.27",
    "tenacity>=8.5",
    "structlog>=24.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "prometheus-client>=0.20",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mongomock>=4.2",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
    "S101",   # asserts are fine in tests
    "B008",   # FastAPI Depends() in defaults
    "RUF012",
    "S105", "S106",
    "S311",   # random for retry jitter is not security sensitive
    "E501",   # line length is handled by `ruff format`
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"scripts/*" = ["S", "E501", "ASYNC"]
