# Local development stack.
#   * MongoDB Atlas Local  -> MongoDB with Atlas Vector Search + Atlas Search (needed for RAG)
#   * MinIO                -> S3-compatible object storage
#   * api                  -> this service
# AWS Bedrock and Sarvam AI are REAL external services: provide AWS credentials and SARVAM_API_KEY in .env.
#
#   cp .env.example .env   # then edit
#   docker compose up --build
#   open http://localhost:8000/docs

services:
  mongo:
    image: mongodb/mongodb-atlas-local:8
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
                  mc mb --ignore-existing local/voice-support-agent-data"

  api:
    build: .
    env_file: [.env]
    environment:
      ENVIRONMENT: local
      LOG_JSON: "false"
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      S3_BUCKET: voice-support-agent-data
      S3_ENDPOINT_URL: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_SSE: none
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      # Bedrock credentials come from the default AWS chain: AWS_* variables in .env, or the mounted ~/.aws profile
    volumes:
      - ${HOME}/.aws:/home/app/.aws:ro
    ports: ["8000:8000"]
    depends_on:
      mongo: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # Optional: dedicated ingestion worker. Run with `docker compose --profile worker up` and set
  # INGESTION_MODE=worker in .env so the API stops ingesting in-process.
  worker:
    build: .
    profiles: ["worker"]
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      S3_BUCKET: voice-support-agent-data
      S3_ENDPOINT_URL: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_SSE: none
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ${HOME}/.aws:/home/app/.aws:ro
    depends_on:
      mongo: { condition: service_healthy }

volumes:
  mongo-data:
  mongo-config:
  minio-data:
